# The config of this project (SPEC-project-scaffold.md 2.1), written by ao-kit init from the profile base-pnpm.
name: du-an-1
package_manager: pnpm
jira:
  space: DA1
github:
  repo: TungPH7/du-an-1
  approvers:
    - TungPH7
  apps:
    dev: tungph7-ao-dev
    dev_id: 5514949
    review: tungph7-ao-review
    review_id: 5514961
    merge: tungph7-ao-merge
    merge_id: 5756976
  kit_peers: []
repos:
  - name: du-an-1
    path: .
apps:
  web:
    repo: du-an-1
    path: apps/web
    profile: nextjs
    dev: pnpm --filter ./apps/web run dev
    port:
      env: PORT
      default: 3000
    health: /en
    public: true
    seo: true
    # The localhost URLs the apps give each other, here so that a lane moves them by its offset.
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      API_URL: http://localhost:3001
    # Test helpers, not code of the app: the changed-lines check skips them.
    coverage_exclude:
      - src/testing/**
    hosts:
      development: du-an-1-dev.ao.t2g.io.vn
      staging: du-an-1-staging.ao.t2g.io.vn
      production: du-an-1.ao.t2g.io.vn
  admin:
    repo: du-an-1
    path: apps/admin
    profile: react
    dev: pnpm --filter ./apps/admin run dev
    port:
      env: PORT
      default: 5173
    health: /
    public: true
    seo: false
    env:
      API_URL: http://localhost:3001
    coverage_exclude:
      - src/testing/**
    hosts:
      development: du-an-1-admin-dev.ao.t2g.io.vn
      staging: du-an-1-admin-staging.ao.t2g.io.vn
      production: du-an-1-admin.ao.t2g.io.vn
  api:
    repo: du-an-1
    path: apps/api
    profile: spring-boot
    dev: pnpm --filter ./apps/api run dev
    env:
      APP_SECURITY_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    port:
      env: PORT
      default: 3001
    health: /actuator/health
    # The <excludes> of jacoco-maven-plugin in apps/api/pom.xml, as source paths; MapperImpl is generated in target/.
    coverage_exclude:
      - src/main/java/com/tungph7/learnpostgres/LearnPostgresqlApiApplication.java
      - src/main/java/com/tungph7/learnpostgres/feature/**/dto/**
      - src/main/java/com/tungph7/learnpostgres/common/dto/**
      - src/main/java/com/tungph7/learnpostgres/common/config/**
      - src/main/java/**/*Properties.java
      - src/main/java/com/tungph7/learnpostgres/common/error/ErrorCode.java
      - src/main/java/com/tungph7/learnpostgres/common/error/ProblemDetailOpenApiCustomizer.java
      - src/main/java/com/tungph7/learnpostgres/common/error/BadRequestException.java
      - src/main/java/com/tungph7/learnpostgres/common/domain/CitextType.java
roles:
  optional: []
claude:
  allow: []
